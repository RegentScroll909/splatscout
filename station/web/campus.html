<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b0e">
  <title>SplatStation · Campus</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Chart tokens (SplatStation is dark-only). Sequential = one blue ramp, darkest near zero; categorical =
       the first four validated slots (light slots); status = reserved good/warning/serious/critical. */
    .viz {
      --seq-1: #184f95; --seq-2: #256abf; --seq-3: #3987e5; --seq-4: #6da7ec; --seq-5: #9ec5f4;
      --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70; --cat-4: #c98500;
      --st-good: #0ca30c; --st-warning: #fab219; --st-serious: #ec835a; --st-critical: #d03b3b;
      --grid: rgba(255, 255, 255, 0.07); --axis: rgba(255, 255, 255, 0.16); --ink-muted: #8794a2; --off: #1a1e24;
    }
    main.campus { max-width: 1320px; gap: 18px; }
    .filters { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
    .seg button { font: inherit; font-size: 0.84rem; color: var(--muted); background: transparent; border: 0; padding: 6px 11px; cursor: pointer; }
    .seg button + button { border-left: 1px solid var(--line-2); }
    .seg button.on { color: var(--text); background: var(--surface-2); }
    .seg button:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .updated { color: var(--dim); font-size: 0.78rem; }
    .updated.warn { color: var(--warn, #f5b942); }

    .kpis { display: grid; grid-template-columns: 1.4fr repeat(5, 1fr); gap: 10px; }
    .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .kpi .lbl { font-family: var(--sans); text-transform: none; letter-spacing: 0; font-size: 0.8rem; color: var(--muted); }
    .kpi .val { font-size: 1.6rem; font-weight: 650; line-height: 1.1; }
    .kpi .sub { font-size: 0.78rem; color: var(--dim); }
    .kpi.hero .val { font-size: 3.2rem; }
    .meter { height: 6px; border-radius: 3px; background: #10305a; overflow: hidden; margin-top: 4px; }
    .meter > div { height: 100%; background: var(--seq-3); border-radius: 3px; }
    @media (max-width: 1100px) { .kpis { grid-template-columns: repeat(3, 1fr); } .kpi.hero { grid-column: span 3; } }
    @media (max-width: 560px) { .kpis { grid-template-columns: repeat(2, 1fr); } .kpi.hero { grid-column: span 2; } }

    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .card-head { display: flex; align-items: flex-start; gap: 10px; }
    .card-head h2 { margin: 0; }
    .card-head .grow { flex: 1; }
    .card .desc { color: var(--muted); font-size: 0.82rem; margin: -4px 0 0; }
    .tbtn { font: inherit; font-size: 0.76rem; color: var(--muted); background: transparent; border: 1px solid var(--line-2); border-radius: 6px; padding: 3px 8px; cursor: pointer; }
    .tbtn.on { color: var(--text); background: var(--surface-2); }

    .mapgrid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(300px, 1fr); gap: 14px; align-items: start; }
    @media (max-width: 980px) { .mapgrid { grid-template-columns: 1fr; } }
    .maptools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .maptools input[type=search] { font: inherit; font-size: 0.85rem; color: var(--text); background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 5px 10px; min-width: 180px; flex: 1; }
    .mapwrap { position: relative; border-radius: 10px; overflow: hidden; background: #0c0f13; border: 1px solid var(--line); }
    #map { display: block; width: 100%; height: min(62vh, 620px); min-height: 360px; touch-action: none; cursor: grab; user-select: none; }
    #map.dragging { cursor: grabbing; }
    #map .b { stroke: var(--axis); stroke-width: 1; vector-effect: non-scaling-stroke; cursor: pointer; }
    #map .b.none { fill: transparent; }
    #map .b.off { fill: var(--off); stroke: var(--grid); cursor: default; }
    #map .b:hover { stroke: #c9d4de; }
    #map .b.sel { stroke: var(--accent); stroke-width: 2.5; }
    #map .lab { fill: var(--text); paint-order: stroke; stroke: #0c0f13; stroke-linejoin: round; pointer-events: none; }
    #map .pt { stroke: #0c0f13; vector-effect: non-scaling-stroke; pointer-events: none; }
    /* A photo or scan that arrived since the last update rings a few times. */
    #map .pt.new { stroke: var(--st-warning); animation: ptnew 1.5s ease-out 4; }
    @keyframes ptnew { from { stroke-width: 0; stroke-opacity: 0.9; } to { stroke-width: 18; stroke-opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { #map .pt.new { animation: none; stroke-width: 3; } }
    .newnote { color: var(--accent); font-weight: 600; }
    .zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; }
    .zoom button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line-2); background: rgba(16, 20, 25, 0.9); color: var(--text); font: inherit; cursor: pointer; }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: 0.78rem; color: var(--muted); }
    .legend .key { display: inline-flex; align-items: center; gap: 6px; }
    .sw { width: 14px; height: 10px; border-radius: 2px; display: inline-block; }
    .sw.line { height: 2px; width: 16px; border-radius: 1px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

    .side { position: sticky; top: 70px; max-height: calc(100vh - 90px); overflow: auto; }
    .side h3 { color: var(--text); font-size: 1.05rem; text-transform: none; letter-spacing: 0; margin: 0; }
    .side .kicker { font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
    .side .muted { color: var(--muted); }
    .big { font-size: 2.4rem; font-weight: 650; line-height: 1; }
    .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem; padding: 2px 8px 2px 6px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--text); white-space: nowrap; }
    .chip .ic2 { width: 14px; height: 14px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 0.62rem; font-weight: 700; color: #0b0b0b; }
    .rows { display: flex; flex-direction: column; }
    .srow { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 9px 0; border-top: 1px solid var(--line); cursor: pointer; }
    .srow:hover .sname { color: var(--accent); }
    .srow .sname { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .srow .smeta { grid-column: 1 / -1; color: var(--muted); font-size: 0.78rem; }
    .bar1 { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.06); overflow: hidden; }
    .bar1 > div { height: 100%; border-radius: 3px; }
    .advice { margin: 0; padding-left: 18px; color: #cdd6df; font-size: 0.86rem; }
    .advice li { margin: 4px 0; }
    .parts { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
    .parts td { padding: 4px 0; border-top: 1px solid var(--line); }
    .parts td.v { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 10px; }
    .plan { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 0.84rem; color: var(--muted); }
    .plan input, .plan select { width: 64px; font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 6px; padding: 4px 6px; }
    .plan select { width: auto; }
    .floors { display: grid; grid-template-columns: minmax(96px, auto) 1fr auto; gap: 4px 10px; align-items: center; font-size: 0.8rem; }
    .floors .fb { height: 8px; background: var(--grid); border-radius: 2px; overflow: hidden; }
    .floors .fb i { display: block; height: 100%; background: var(--seq-3); border-radius: 0 2px 2px 0; }
    .floors .n { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; white-space: nowrap; }
    .since { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 12px; font-size: 0.86rem; }
    .live { display: inline-flex; align-items: center; gap: 5px; font-size: 0.8rem; color: var(--muted); cursor: pointer; }
    .live input { margin: 0; }
    .lightbars { display: grid; grid-template-columns: 76px 1fr 40px; gap: 4px 8px; align-items: center; font-size: 0.8rem; }
    .lightbars .b2 { height: 10px; border-radius: 0 3px 3px 0; min-width: 0; }
    .lightbars .n { text-align: right; font-family: var(--mono); color: var(--muted); }

    .charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    @media (max-width: 980px) { .charts { grid-template-columns: 1fr; } }
    .chart svg { display: block; width: 100%; overflow: visible; }
    .chart text { fill: var(--ink-muted); font-size: 11px; font-family: var(--sans); }
    .chart .axisline { stroke: var(--axis); }
    .chart .gridline { stroke: var(--grid); }
    .chart .hit { fill: transparent; cursor: pointer; }
    .chart .lift { filter: brightness(1.25); }
    .tablev { overflow: auto; max-height: 340px; }
    .tablev table, table.data { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
    .tablev th, .tablev td, table.data th, table.data td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
    .tablev th, table.data th { color: var(--dim); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; position: sticky; top: 0; background: var(--surface); }
    .tablev td.n, table.data td.n { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); }
    table.data th.sortable { cursor: pointer; }
    table.data th.sortable:hover { color: var(--text); }
    table.data tr.click { cursor: pointer; }
    table.data tr.click:hover td { background: var(--surface-2); }
    table.data tr.off td { color: var(--dim); }
    .mini { display: inline-flex; gap: 2px; vertical-align: middle; }
    .mini span { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
    .tbar { display: inline-block; width: 80px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.06); vertical-align: middle; margin-right: 8px; overflow: hidden; }
    .tbar > i { display: block; height: 100%; background: var(--seq-3); border-radius: 3px; }
    .empty-note { color: var(--dim); font-size: 0.86rem; padding: 18px 4px; text-align: center; }

    #tip { position: fixed; z-index: 30; pointer-events: none; background: rgba(12, 15, 19, 0.97); border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; font-size: 0.8rem; max-width: 300px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); display: none; }
    #tip .v { font-weight: 650; font-size: 0.95rem; color: var(--text); }
    #tip .r { color: var(--muted); display: flex; align-items: center; gap: 6px; }
    #tip .k { width: 12px; height: 2px; border-radius: 1px; display: inline-block; }
    .how p { margin: 6px 0; color: #cdd6df; font-size: 0.88rem; max-width: 900px; }
    .how h3 { color: var(--text); text-transform: none; letter-spacing: 0; font-size: 0.95rem; margin: 10px 0 4px; }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="icon.svg" alt="" class="logo">
      <div>
        <h1>Campus <span class="tag new">Beta</span></h1>
        <div class="sub">Where the club has photos and splats, how complete each building is, and how good a splat to expect</div>
      </div>
    </div>
    <div style="display:flex;gap:8px">
      <a class="btn small ghost" href="club.html">Club photos &amp; members</a>
      <a class="btn small ghost" href="/">← Dashboard</a>
    </div>
  </header>

  <main class="campus viz">
    <div class="filters" role="toolbar" aria-label="Filters">
      <div class="seg" id="campusSeg" aria-label="Campus"></div>
      <span class="muted small">Activity</span>
      <div class="seg" id="periodSeg" aria-label="Activity period"></div>
      <span class="grow"></span>
      <span class="updated" id="updated"></span>
      <label class="live" title="Check for new photos every 15 seconds while this page is open"><input type="checkbox" id="live" checked> Live</label>
      <button class="btn small ghost" id="refresh">Refresh</button>
      <button class="btn small ghost" id="fresh" title="Start the map from zero: only photos, scans and splats from now on count. Nothing is deleted, and you can switch back.">Start fresh</button>
      <span class="updated" id="pubState" aria-live="polite"></span>
      <button class="btn small" id="publish" title="Send each space’s expected quality, photos per light and what it still needs (no member names, no GPS points) to the Campus map in members’ phones. It also happens by itself after you review photos on the Club page.">Publish to members</button>
    </div>
    <div id="notes"></div>
    <div id="since" class="since" aria-live="polite" hidden></div>
    <section class="kpis" id="kpis" aria-label="Headline numbers"></section>

    <section class="mapgrid">
      <div class="card">
        <div class="card-head">
          <div class="grow"><h2>Campus map</h2><p class="desc">Buildings coloured by how much of their floor area is covered. Click one for its floors and spaces.</p></div>
        </div>
        <div class="maptools">
          <input type="search" id="find" placeholder="Find a building" list="bnames" aria-label="Find a building">
          <datalist id="bnames"></datalist>
          <label class="check inline"><input type="checkbox" id="lyrPoints" checked> <span>Where photos were taken</span></label>
          <label class="check inline"><input type="checkbox" id="lyrLabels" checked> <span>Names</span></label>
        </div>
        <div class="mapwrap">
          <svg id="map" role="img" aria-label="Campus map of buildings coloured by completion"></svg>
          <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zfit" aria-label="Show the whole campus">⤢</button></div>
        </div>
        <div class="legend" id="mapLegend"></div>
      </div>
      <aside class="card side" id="side" aria-live="polite"></aside>
    </section>

    <section class="charts">
      <div class="card chart" id="qualityCard"></div>
      <div class="card chart" id="rankCard"></div>
      <div class="card chart" id="lightCard"></div>
      <div class="card chart" id="activityCard"></div>
    </section>

    <section class="card" id="tableCard"></section>
    <section class="card how" id="howCard"></section>
  </main>
  <div id="tip" role="tooltip"></div>
  <script type="module" src="campus.js"></script>
</body>
</html>
