<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SplatStation</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="icon.svg" alt="" class="logo">
      <div>
        <h1>SplatStation</h1>
        <div class="muted small">Captures in, Gaussian splats out</div>
      </div>
    </div>
    <div id="gpu" class="gpu">GPU…</div>
  </header>

  <main>
    <section class="card add">
      <div id="drop" class="drop">
        <input id="file" type="file" accept=".zip,video/*" multiple hidden>
        <div class="drop-icon">⬆</div>
        <div><b>Drop SplatScout ZIPs or videos here</b></div>
        <div class="muted small">or <button class="link" id="pick">choose files</button></div>
        <div id="uploads"></div>
      </div>
      <div class="settings">
        <label class="field">Quality
          <select id="preset"></select>
        </label>
        <label class="toggle"><input type="checkbox" id="usePoses"> Use phone AR poses when available</label>
        <label class="toggle"><input type="checkbox" id="adb"> Auto-import from a phone plugged in over USB</label>
        <div id="phone" class="small muted"></div>
        <div id="paths" class="small muted"></div>
      </div>
    </section>

    <section>
      <h2>Jobs</h2>
      <div id="jobs"><p class="muted">Loading…</p></div>
    </section>

    <section>
      <h2>Library</h2>
      <div id="library" class="lib"></div>
    </section>

    <section>
      <details class="card">
        <summary>Activity log</summary>
        <pre id="log" class="log"></pre>
      </details>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
